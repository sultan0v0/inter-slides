<style>
:root{--bg:#101a37;--bg2:#18264a;--ink:#f7f6f0;--muted:#a7b1c4;--accent:#f5bd52;--accent2:#9caef3;--glow:rgba(245,189,82,.24);--line:rgba(255,255,255,.12);--slide:0;--ease:cubic-bezier(.22,.7,.2,1)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background 1s var(--ease),color .6s;user-select:none;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 74% 48%,var(--glow),transparent 48%),radial-gradient(ellipse at 15% 8%,rgba(255,255,255,.045),transparent 34%);transition:background 1s ease}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.13;z-index:5;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.94' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
.app{height:100dvh;min-height:480px;position:relative;isolation:isolate}.topline{position:absolute;left:5.2vw;right:5.2vw;top:34px;display:flex;align-items:center;justify-content:space-between;z-index:4}.mark{display:flex;gap:9px;align-items:center}.mark i{width:9px;height:9px;background:var(--accent);border-radius:50%;box-shadow:0 0 18px var(--accent);transition:all .8s}.mark b{font:500 10px 'DM Mono',monospace;letter-spacing:.24em;color:var(--muted)}.counter{font:400 11px 'DM Mono',monospace;color:var(--muted);letter-spacing:.12em}.counter strong{font-weight:400;color:var(--ink)}
.layout{position:absolute;inset:95px 5.2vw 92px;display:grid;grid-template-columns:minmax(290px,.82fr) minmax(420px,1.18fr);align-items:center;gap:2.5vw;max-width:1500px;margin:auto}.copy{z-index:2;max-width:550px;transform:translateY(9px)}.eyebrow{display:flex;align-items:center;gap:12px;color:var(--accent);font:500 10px 'DM Mono',monospace;letter-spacing:.25em;text-transform:uppercase;transition:color .8s}.eyebrow:before{content:"";width:28px;height:1px;background:currentColor}.title{margin:24px 0 0;font-size:clamp(42px,6.2vw,88px);line-height:.99;letter-spacing:-.075em;font-weight:600;max-width:570px}.title span{color:var(--accent);transition:color .8s}.sub{height:1px;width:70px;margin-top:36px;background:var(--line)}
.visual{height:min(69vh,660px);min-height:360px;position:relative;display:grid;place-items:center;perspective:1100px}.orb{position:absolute;width:min(39vw,510px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 35%,var(--glow),transparent 68%);filter:blur(25px);transition:all 1s ease}.art{width:100%;height:100%;position:relative;z-index:1;overflow:visible;filter:drop-shadow(0 25px 48px rgba(0,0,0,.2));transition:transform .9s var(--ease),opacity .45s}.art .float{animation:float 6s ease-in-out infinite}.art .float2{animation:float 7.4s ease-in-out -2s infinite}.art .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.art .spin{animation:spin 28s linear infinite;transform-box:fill-box;transform-origin:center}.art .dash{stroke-dasharray:7 10;animation:dash 14s linear infinite}.art .bob{animation:bob 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.footer{position:absolute;left:5.2vw;right:5.2vw;bottom:30px;display:flex;align-items:center;justify-content:space-between;z-index:4}.progress{display:flex;gap:7px;align-items:center}.dot{width:23px;height:3px;border:0;padding:0;border-radius:9px;background:rgba(255,255,255,.2);cursor:pointer;transition:width .5s var(--ease),background .6s}.dot.active{width:42px;background:var(--accent)}.controls{display:flex;gap:9px}.nav{width:43px;height:43px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.025);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:all .25s}.nav:hover{border-color:var(--accent);background:var(--glow);transform:translateY(-2px)}.nav svg{width:16px;height:16px}.hint{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);font:9px 'DM Mono',monospace;color:rgba(255,255,255,.28);letter-spacing:.15em}
.enter .copy>*{animation:rise .7s var(--ease) both}.enter .copy .title{animation-delay:.07s}.enter .copy .sub{animation-delay:.13s}.enter .art{animation:artin .9s var(--ease) both}
.mark b,.counter,.hint,.copy{display:none}.layout{inset:70px 7vw 82px;grid-template-columns:1fr;max-width:1450px}.visual{height:min(82vh,790px)}.orb{width:min(50vw,600px)}.art{width:min(100%,1000px)}
@keyframes rise{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:translateY(0)}}@keyframes artin{from{opacity:0;transform:translateY(13px) scale(.965) rotateY(-5deg)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes pulse{0%,100%{opacity:.78;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@media(max-width:800px){.topline{top:22px}.layout{inset:54px 4vw 68px;grid-template-rows:minmax(220px,1fr)}.visual{height:min(82vh,650px);min-height:220px}.orb{width:min(78vw,410px)}.footer{bottom:19px}}
@media(max-width:420px){.layout{inset:72px 6vw 76px;grid-template-rows:auto minmax(190px,1fr)}.title{font-size:clamp(42px,11vw,58px)}.visual{min-height:190px}.dot{width:16px}.dot.active{width:29px}.nav{width:38px;height:38px}.footer{left:6vw;right:6vw}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>

let i=0,timer;const $=x=>document.getElementById(x),root=document.documentElement,app=$('app');
S.forEach((_,n)=>{const b=document.createElement('button');b.className='dot';b.type='button';b.addEventListener('click',()=>go(n));$('progress').appendChild(b)});
function go(n){i=(n+S.length)%S.length;const s=S[i];const keys={bg:'--bg',bg2:'--bg2',accent:'--accent',accent2:'--accent2',glow:'--glow',ink:'--ink',muted:'--muted',line:'--line'};for(const [k,v] of Object.entries(keys))root.style.setProperty(v,s[k]||({ink:'#f7f6f0',muted:'#a7b1c4',line:'rgba(255,255,255,.12)'}[k]));$('art').innerHTML=s.art;[...$('progress').children].forEach((b,j)=>b.classList.toggle('active',i===j));app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter')}
function next(d){go(i+d)}$('prev').onclick=()=>next(-1);$('next').onclick=()=>next(1);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();next(-1)}if(e.key==='Home')go(0);if(e.key==='End')go(S.length-1)});let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))next(dx<0?1:-1)},{passive:true});document.addEventListener('wheel',e=>{if(timer)return;timer=setTimeout(()=>timer=null,700);if(Math.abs(e.deltaY)>18)next(e.deltaY>0?1:-1)},{passive:true});go(0);
